# Server
server.port=${PORT:8080}

# Database (PostgreSQL on Render, H2 locally fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/chatdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Upload
spring.servlet.multipart.max-file-size=350MB
spring.servlet.multipart.max-request-size=350MB

# Upload Directory (Local fallback)
app.upload.dir=./uploads

# Cloudinary
cloudinary.url=${CLOUDINARY_URL:}
